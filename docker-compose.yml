version: '3.8'

services:
  trade-ai-api:
    build: .
    container_name: cryptoaid-trade-ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LIVE_TRADING_ENABLED=false
      - POLYGON_RPC=${POLYGON_RPC:-https://polygon-bor-rpc.publicnode.com}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_GROUP=${TELEGRAM_GROUP:-@cryptoAIDsupporter}
      - TELEGRAM_CHANNEL=${TELEGRAM_CHANNEL:-@cryptoaidsup}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
