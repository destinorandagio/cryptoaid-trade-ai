name: Telegram Signal Publisher

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (true/false)'
        required: true
        default: 'true'

jobs:
  publish-controlled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Controlled Publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -c "from src.telegram.router import TelegramTopicRouter; from src.telegram.formatter import format_ai_signal; r = TelegramTopicRouter(); text = format_ai_signal('sig_ci_01', 'BTC/USDC', 'LONG', 0.84, '4H', 64500.0, 63200.0, 67100.0, 2.0, ['CI controlled test signal'], '2026-09-04 08:30:00 UTC'); res = r.publish('VERIFIED_AI_SIGNAL', text, dry_run=(${{ github.event.inputs.dry_run }} == true)); print('Publish result:', res)"
